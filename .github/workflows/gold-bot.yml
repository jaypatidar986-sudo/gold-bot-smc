name: Gold SMC Bot

on:
  schedule:
    - cron: '*/15 0-23 * * 1-4'
    - cron: '*/15 0-22 * * 5'
    - cron: '*/15 22-23 * * 0'
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TD_KEY: ${{ secrets.TD_KEY }}
